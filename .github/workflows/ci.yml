name: CI

on:
  push:
    # The repo's default branch is currently claude/affectionate-wright-b6ps16; main is listed for after a rename.
    branches: [main, claude/affectionate-wright-b6ps16]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: git config --global user.email ci@example.com && git config --global user.name CI
      - run: npm run typecheck
      - run: npm test
      - run: npm run build && npm run build:server

name: Release macOS app

# Push a tag like v0.2.0 to build, sign, notarize and publish the .dmg/.zip to a GitHub Release.
# Run it manually (workflow_dispatch) to get the build as a workflow artifact without publishing.
#
# Secrets (Settings → Secrets and variables → Actions). Without them the app is built UNSIGNED:
#   CSC_LINK                    base64 of your "Developer ID Application" certificate exported as .p12
#   CSC_KEY_PASSWORD            the .p12 password
#   APPLE_ID                    Apple ID email of the developer account
#   APPLE_APP_SPECIFIC_PASSWORD app-specific password from appleid.apple.com
#   APPLE_TEAM_ID               10-character team ID
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: git config --global user.email ci@example.com && git config --global user.name CI
      - run: npm run typecheck
      - run: npm test

      - name: Use the tag as the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version -w desktop

      - name: Build, sign and notarize
        run: npm run desktop:dist
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Signing summary
        env:
          HAS_CERT: ${{ secrets.CSC_LINK != '' }}
          HAS_NOTARY: ${{ secrets.APPLE_ID != '' }}
        run: |
          {
            echo "### macOS build"
            echo "- Signed: $HAS_CERT"
            echo "- Notarized: $HAS_NOTARY"
            [ "$HAS_CERT" = "true" ] || echo "> Unsigned build: on macOS 15+ users must try to open the app, then go to System Settings → Privacy & Security → Open Anyway (older macOS: right-click → Open). Add the Apple secrets to sign and notarize."
            ls -lh desktop/release/*.dmg desktop/release/*.zip | sed 's/^/    /'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            desktop/release/*.dmg
            desktop/release/*.zip
